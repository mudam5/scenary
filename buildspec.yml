version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: latest
  pre_build:
    commands:
      - echo "Pre-build phase"
  build:
    commands:
      - echo "Build phase"
      - npm install
      # - npm run build  # Uncomment if needed
  post_build:
    commands:
      - echo "Post-build phase"
      - echo "Build completed on $(date)"
      - echo "Artifacts copied to S3"

artifacts:
  files:
    - '**/*'
  name: scenery_app
      
